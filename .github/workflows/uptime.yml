name: External VPS monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Normal check or labelled, one-time Telegram test'
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - self-test

permissions:
  contents: write

concurrency:
  group: external-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MONITOR_MODE: ${{ inputs.mode || 'monitor' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Download monitor from this exact source commit
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/monitor.py?ref=$GITHUB_SHA" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/atletid-external-monitor.py"
      - name: Check production and deliver pending alerts
        shell: bash
        run: python3 "$RUNNER_TEMP/atletid-external-monitor.py" --mode "$MONITOR_MODE"
